# -----------------------------------------------------------
# Nginx server configuration for CoPI
#
# This file is used as a template by the nginx Docker image.
# It is mounted at /etc/nginx/templates/default.conf.template
# and envsubst replaces ${DOMAIN} at container startup.
# The output goes to /etc/nginx/conf.d/default.conf, which is
# included inside the default nginx.conf's http{} block.
#
# Handles:
#   - HTTPS termination with Let's Encrypt certificates
#   - HTTP → HTTPS redirect
#   - ACME challenge serving for certbot renewal
#   - Reverse proxy to the FastAPI app (uvicorn) on port 8000
#   - Security headers
# -----------------------------------------------------------

# -----------------------------------------------------------
# Rate-limiting zones (SEC-15)
#
# This file is included inside the stock nginx.conf http{} block, so these
# http-context directives are valid here. Keyed by client IP:
#   - req_general: broad per-IP request cap for the whole site.
#   - req_graph:   tighter cap for the four public collaboration-graph routes,
#                  which are unauthenticated and DB-heavy (seq-scans + O(V^2)
#                  clustering); paired with the app-side payload cache.
#   - conn_perip:  concurrent-connection cap per IP.
#
# One set of zones PER VHOST (#27 Minor 16) — these were a single shared zone
# apiece across all three vhosts (${DOMAIN}, devel, blackbird), so one IP's
# burst against devel or blackbird consumed the primary site's whole budget,
# and vice versa. Each `limit_req_zone`/`limit_conn_zone` line here allocates
# its own shared-memory segment (nginx does not merge same-named declarations
# across vhosts here — there IS only one declaration per name). devel has no
# public collaboration-graph routes, so it gets no req_graph zone at all.
#
# SIZES ARE PER-POPULATION, NOT A FLAT 10m (#27 I5 / over-impl R9). The split
# left eight zones at the 10m the single shared zones had used, i.e. 80m plus
# the 10m `ssl_session_cache shared:SSL` the three vhosts declare under one
# name (one segment, not three) = 90m declared into a 128m cgroup — inside the
# limit only while the zones stayed empty. Re-derived 2026-09-04 against what
# each zone's population can actually be (1m holds ~16k IPv4 states):
#   * limit_req state is per source IP and lives for the rate window, so its
#     population is "distinct clients seen in the window" — two orders of
#     magnitude apart between the public site (10m, ~160k) and an
#     SSH-tunnelled dev vhost (1m).
#   * limit_conn state exists only while an IP holds an OPEN connection, so
#     its population is bounded by CONCURRENT connections, not by distinct
#     clients ever seen. conn_perip_main at 4m (~64k states) is above the
#     ~24k client connections stock worker_connections (1024) x 48 workers
#     can hold at all, so it cannot be the zone that fills.
# Totals: 27m of rate/conn zones + SSL 10m = 37m of shared memory. The
# per-worker allowance and the cgroup check live in the
# `nginx-mem-budget:` line in docker-compose.prod.yml, which
# tests/unit/test_nginx_config.py enforces against these declarations.
# (worker_processes is NOT settable here: this file is a conf.d snippet and
# worker_processes is a main-context directive, so the worker count is the
# image's stock `auto` — 48 on the prod host.)
# -----------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=req_general_main:10m       rate=20r/s;
limit_req_zone  $binary_remote_addr zone=req_general_devel:1m       rate=20r/s;
limit_req_zone  $binary_remote_addr zone=req_general_blackbird:4m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=req_graph_main:4m          rate=2r/s;
limit_req_zone  $binary_remote_addr zone=req_graph_blackbird:1m     rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_perip_main:4m;
limit_conn_zone $binary_remote_addr zone=conn_perip_devel:1m;
limit_conn_zone $binary_remote_addr zone=conn_perip_blackbird:2m;

# Return 429 (not the default 503) when a client trips a limit.
limit_req_status 429;
limit_conn_status 429;

# Upstream definition for the FastAPI app
upstream app {
    server app:8000;
}

# Upstream for the devel.copi.science instance running on the host (e.g. via
# an SSH tunnel) at localhost:8858. Reached via host.docker.internal, which
# resolves to the host gateway thanks to extra_hosts in docker-compose.
upstream devel_app {
    server host.docker.internal:8858;
}

# -----------------------------------------------------------
# HTTP server — redirect to HTTPS + serve ACME challenges
# -----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------
# HTTPS server — reverse proxy to the FastAPI app
# -----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    # SSL certificate paths (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Enforcing header (audit 2026-09-08 RC-5, #27 I5): scoped to directives that
    # cannot break rendering no matter what base.html's inline PostHog bootstrap or
    # the Tailwind CDN <script> do -- frame-ancestors/base-uri/form-action/object-src
    # never affect same-origin script or style execution.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Report-only for everything else until base.html's Tailwind-CDN <script> and
    # inline PostHog bootstrap are audited for nonces/hashes (#27 I5 decision).
    # report-uri collects what an enforcing default-src/script-src would break
    # (POST /api/csp-report, src/main.py) so that audit has real violation data
    # instead of nothing (RC-5: this header previously had no report-uri/report-to
    # at all, so violations went nowhere).
    # 'unsafe-eval' exists only for the Tailwind Play CDN, which JIT-compiles
    # utility classes in the browser (SEC-18: drop once a compiled Tailwind
    # build is vendored).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self' https://us.i.posthog.com https://us-assets.i.posthog.com; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;

    # Request size limit
    client_max_body_size 10m;

    # Per-IP concurrent-connection cap for the whole site (SEC-15). Its own zone
    # per vhost (#27 Minor 16) — see the declarations above.
    limit_conn conn_perip_main 30;

    # Tighter limit for the unauthenticated, DB-heavy collaboration-graph
    # routes (SEC-15). Listed before `location /` so it wins for these paths.
    location ~ ^/(cabo-graph|scripps-graph|schultz-alumni-pilot|schultz-group-alumni)$ {
        limit_req zone=req_graph_main burst=5 nodelay;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Slack app provisioning calls the Manifest API and waits on Slack's
    # response; the general 120s proxy_read_timeout turns a slow provision
    # into a 504 (#27 I5, cross-referenced against #24 C2's provisioning
    # retry loop — fixing only this side leaves the other symptom). This
    # route is session-authenticated (admin-only), so it deliberately gets
    # no limit_req zone here — SEC-15's zones target unauthenticated traffic.
    # Kept before the catch-all for readability; regex locations take
    # precedence regardless of order. The regex is deliberately unanchored
    # at the end, so any future `.../slack/provision/*` sub-route inherits
    # the 300s timeout too.
    location ~ ^/admin/agents/[^/]+/slack/provision {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Reverse proxy to the FastAPI app
    location / {
        # Broad per-IP request cap; burst absorbs normal page loads (SEC-15).
        limit_req zone=req_general_main burst=40 nodelay;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # PostHog reverse proxy — routes through copi.science to bypass ad blockers
    location /ingest/static/ {
        proxy_pass https://us-assets.i.posthog.com/static/;
        proxy_set_header Host us-assets.i.posthog.com;
        proxy_ssl_server_name on;
    }

    location /ingest/ {
        proxy_pass https://us.i.posthog.com/;
        proxy_set_header Host us.i.posthog.com;
        proxy_ssl_server_name on;
    }
}

# -----------------------------------------------------------
# devel.copi.science — HTTP server (redirect + ACME challenges)
# -----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name devel.copi.science;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------
# devel.copi.science — HTTPS reverse proxy to host:8858
# Cert is the expanded copi.science SAN cert (same lineage).
# -----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name devel.copi.science;

    ssl_certificate     /etc/letsencrypt/live/copi.science/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/copi.science/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Enforcing header (audit 2026-09-08 RC-5, #27 I5): scoped to directives that
    # cannot break rendering no matter what base.html's inline PostHog bootstrap or
    # the Tailwind CDN <script> do -- frame-ancestors/base-uri/form-action/object-src
    # never affect same-origin script or style execution.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Report-only for everything else until base.html's Tailwind-CDN <script> and
    # inline PostHog bootstrap are audited for nonces/hashes (#27 I5 decision).
    # report-uri collects what an enforcing default-src/script-src would break
    # (POST /api/csp-report, src/main.py) so that audit has real violation data
    # instead of nothing (RC-5: this header previously had no report-uri/report-to
    # at all, so violations went nowhere).
    # 'unsafe-eval' exists only for the Tailwind Play CDN, which JIT-compiles
    # utility classes in the browser (SEC-18: drop once a compiled Tailwind
    # build is vendored).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self' https://us.i.posthog.com https://us-assets.i.posthog.com; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;

    client_max_body_size 10m;

    # Per-IP connection cap for the whole vhost (#27 I5 — SEC-15 zones existed
    # but were only ever wired into the ${DOMAIN} server). Its own zone, not
    # shared with the other vhosts (#27 Minor 16).
    limit_conn conn_perip_devel 30;

    location / {
        # Broad per-IP request cap; burst absorbs normal page loads.
        limit_req zone=req_general_devel burst=40 nodelay;

        proxy_pass http://devel_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}

# ===========================================================
# blackbird.copi.science — 2nd isolated CoPI stack (copi-blackbird)
# Proxies to the blackbird-app container over the shared copi-edge network.
# ===========================================================
upstream blackbird_app {
    server blackbird-app:8000;
}

# HTTP — ACME challenges + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name blackbird.copi.science;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — reverse proxy to the blackbird-app container
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blackbird.copi.science;

    ssl_certificate     /etc/letsencrypt/live/blackbird.copi.science/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blackbird.copi.science/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Enforcing header (audit 2026-09-08 RC-5, #27 I5): scoped to directives that
    # cannot break rendering no matter what base.html's inline PostHog bootstrap or
    # the Tailwind CDN <script> do -- frame-ancestors/base-uri/form-action/object-src
    # never affect same-origin script or style execution.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Report-only for everything else until base.html's Tailwind-CDN <script> and
    # inline PostHog bootstrap are audited for nonces/hashes (#27 I5 decision).
    # report-uri collects what an enforcing default-src/script-src would break
    # (POST /api/csp-report, src/main.py) so that audit has real violation data
    # instead of nothing (RC-5: this header previously had no report-uri/report-to
    # at all, so violations went nowhere).
    # 'unsafe-eval' exists only for the Tailwind Play CDN, which JIT-compiles
    # utility classes in the browser (SEC-18: drop once a compiled Tailwind
    # build is vendored).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self' https://us.i.posthog.com https://us-assets.i.posthog.com; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;

    client_max_body_size 10m;

    # Its own zone, not shared with the other vhosts (#27 Minor 16).
    limit_conn conn_perip_blackbird 30;

    # Same tighter per-IP cap as the primary vhost for the unauthenticated,
    # DB-heavy collaboration-graph routes (SEC-15 / #27 I5 minor follow-up —
    # blackbird serves these paths too, via its own blackbird_app upstream).
    # Headers/timeouts match blackbird's own location / below.
    location ~ ^/(cabo-graph|scripps-graph|schultz-alumni-pilot|schultz-group-alumni)$ {
        limit_req zone=req_graph_blackbird burst=5 nodelay;

        proxy_pass http://blackbird_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    location / {
        limit_req zone=req_general_blackbird burst=40 nodelay;

        proxy_pass http://blackbird_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}
