label = "Scout Hub"
tools = ["retrieve_profile", "retrieve_abstract", "retrieve_full_text", "search_prior_art", "consult_specialist"]

# Reply-only role: the hub never makes a top-level post, of any type — every
# message it sends is a reply inside an interview thread (Phase 4). An absent
# `post_types` key would fall back to DEFAULT_POST_TYPES (see
# src/agent/post_types.py), which is NOT empty — so this must stay an explicit
# empty list, not a deleted key, or the hub would silently regain a top-level
# post type by accident. The Opportunity Assessment this role used to file as a
# standalone post is now the `<assessment_json>` sidecar carried inside the
# concluding Phase-4 reply itself (see phase4-thread-reply.md). The engine also
# hard-gates Phase 5 for this role; this declaration is belt-and-suspenders.
post_types = []
