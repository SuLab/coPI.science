# Version of the pi_lab PROMPT SET (this manifest + the four BASE prompt files
# prompts/{agent-system,identity,phase4-thread-reply,phase5-new-post}.md —
# pi_lab is the absence of overrides, see src/agent/roles.py). Bump on ANY
# edit to those files; see the matching note in scout_hub/role.toml.
# 1.1.0 records the lab-visible behavior changes: persona PMIDs, channels by tag
# section, cohort-gated retrieve_profile and removal of the lab directory.
# 1.2.0 fences the lab's own profile as <lab_profile> data and adds the "Publication Records" section for a lab with no publication records (publication handling, Phase 5).
version = "1.2.0"

label = "PI Lab"
tools = ["retrieve_profile", "retrieve_abstract", "retrieve_full_text"]

# Layer 1: the lab's single top-level post type. Declared explicitly so a new
# type added to DEFAULT_POST_TYPES can never silently reach labs (same rule as
# the hub's role.toml).

[[post_types]]
name = "pitch"
