# Blackbird's screening rubric — the single, manually editable source of truth.
#
# This document IS the rubric: src/services/blackbird_rubric.py loads it once at
# import (weights, band thresholds, scale, prose), validates it, and renders the
# markdown section the scouting hub's system prompt carries (the {rubric}
# placeholder in prompts/roles/scout_hub/agent-system.md). The admin assessments
# page reads its weights and banding from the same load. Nothing else defines
# these numbers — edit them here, nowhere else.
#
# TWO SCALES, one document. Every dimension carries an investment weight/anchor
# pair (`weight` / `anchors`) and an incubation-stage pair (`weight_incubation` /
# `anchors_incubation`), and [banding] / [banding.incubation] carry a band-line
# pair to match. Which pair scores a verdict is chosen from that verdict's
# `funnel_stage`: anything starting "incubation" uses the incubation scale, every
# other stage (and a missing one) uses the investment scale. The band NAMES are
# shared — "advance" / "conditional" / "pass" — so only the numbers differ, and
# no schema, sidecar or template change follows from re-cutting either scale.
# Rationale, the 34-verdict back-test behind the incubation numbers, and the
# calibration checkpoints: docs/specs/2026-08-20-rubric-v2-incubation-rebaseline-proposal.md.
#
# Editing workflow (docs/plans/2026-08-20-assessments-rca-ux-specialist-visibility.md §4.3):
#   1. Edit this file. Bump [meta].version and note the change in [meta].changelog.
#   2. Run ./scripts/ci.sh — the import-time validator and the characterization
#      pin in tests/unit/test_rubric_document.py are the review gate. A
#      deliberate calibration change updates that test in the same commit.
#   3. Restart blackbird-app and start a fresh agent run (prompts/ is bind-mounted
#      into both, so no image rebuild) — the startup banner prints the rubric
#      version and content hash; confirm they match this file.
#      ⚠️ That "no image rebuild" holds for a pure DATA edit only. This file is
#      bind-mounted but src/ is BAKED IN, so a restart onto an old image reads
#      the new numbers with the old scoring code — e.g. an image predating the
#      stage-aware scoring of v2.0.0 would score every verdict on the investment
#      scale while stamping it rubric_version 2.0.0. If the change came with any
#      src/ change, rebuild both images first.
#   4. New assessments are stamped with [meta].version + content hash, so
#      pre-/post-change rows stay comparable.
#
# Validation, enforced at import (RubricError on failure): exactly 13 dimensions,
# unique keys, integer weights summing to 100 for EACH scale, all four thresholds
# on the 0.01 grid with advance_min > conditional_min in BOTH bands, non-empty
# titles/anchors/anchors_incubation/prose, version present.

