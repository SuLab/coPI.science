# Logging override — the EC2 instance role (copi-ec2-ses-role) lacks
# logs:CreateLogStream, so the awslogs driver in docker-compose.prod.yml makes
# every container fail to start with an AccessDeniedException. This forces the
# local json-file driver instead. This file MUST be passed alongside
# docker-compose.prod.yml on every prod compose invocation (see CLAUDE.md
# "Compose file set") — running prod off docker-compose.prod.yml alone
# recreates every service with the broken awslogs driver.
#
# Remove this file once the admin adds CloudWatch Logs perms to the role
# (or restores the previous role with the SES policy attached).
#
# json-file with no options grows unbounded on disk -- max-size/max-file caps
# each service's log at 5 x 50m = 250 MiB.
services:
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  app:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  worker:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  agent:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  grantbot:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  nginx:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  certbot:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  migrate:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
