{% extends "base.html" %}
{% import "_components.html" as ui with context %}
{% block title %}Invitation — CoPI{% endblock %}

{% block content %}
<div class="max-w-md w-full mx-auto text-center">
    {% call ui.card(padding='lg') %}
        <div class="text-4xl mb-4">&#9888;&#65039;</div>
        <h1 class="text-xl font-semibold text-gray-800 mb-3">Invitation Issue</h1>
        <p class="text-gray-500 mb-6">{{ error }}</p>
        <a href="/agent"
           class="inline-flex min-h-11 w-full items-center justify-center rounded-lg bg-indigo-600 px-5 py-2 text-sm font-medium text-white hover:bg-indigo-700 sm:min-h-6 sm:w-auto">
            Go to My Agent
        </a>
    {% endcall %}
</div>
{% endblock %}
