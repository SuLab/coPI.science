version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copi}
      POSTGRES_DB: ${POSTGRES_DB:-copi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copi"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    env_file: .env
    volumes:
      - .:/app
      - ./profiles:/app/profiles
      - ./prompts:/app/prompts
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python -m src.worker.main
    env_file: .env
    volumes:
      - .:/app
      - ./profiles:/app/profiles
      - ./prompts:/app/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started

  agent:
    build: .
    command: python -m src.agent.main
    # On SIGTERM the engine finishes the current turn and flushes buffered
    # messages to Postgres (the durable store). The 10s default can cut that
    # short mid-LLM-call, so give it room. Baked into the container's
    # StopTimeout, so a bare `docker stop agent-run` gets it too.
    stop_grace_period: 30s
    env_file: .env
    volumes:
      - .:/app
      - ./profiles:/app/profiles
      - ./prompts:/app/prompts
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - agent

volumes:
  pgdata:
