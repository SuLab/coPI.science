[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copi"
version = "0.1.0"
description = "CoPI/LabAgent — Research collaboration platform with Slack-based AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "anthropic>=0.26.0",
    "slack-sdk>=3.27.0",
    "pydantic-settings>=2.2.0",
    "itsdangerous>=2.2.0",
    "boto3>=1.34.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "plotly>=5.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "testcontainers[postgres]>=4.0.0",
    "respx>=0.21.0",
    "syrupy>=4.6.0",
    "coverage[toml]>=7.5.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    # mutmut 3.x's instrumentation trampoline rejects this repo's `src.`-prefixed
    # module names; 2.x mutates files directly and works with the src/ layout.
    "mutmut>=2.4,<3",
    # For the human/driven half of tests/e2e only — the browser that replays
    # tests/e2e/test_browser_flows.py::FLOWS and drops its screenshots in
    # .playwright-mcp/. NOTHING under tests/ imports it: the pytest tier in that
    # directory is httpx replays of the same route sequences, so `pytest tests/`
    # is green without it and the wheel alone is not enough to drive a browser —
    # `python -m playwright install chromium` fetches the ~300MB binaries, which
    # pip cannot. Pinned as a floor, not an upper bound; the browser build is
    # chosen by that command, not by this line.
    "playwright>=1.44.0",
]

[project.scripts]
copi = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: needs a real Postgres (testcontainers) + Docker",
    "characterization: golden-master snapshot test",
    "contract: respx-mocked external HTTP",
    "real_llm: spends real Anthropic tokens; skipped unless ANTHROPIC_API_KEY is set",
    "live_slack: hits a real Slack workspace; needs SLACK_TEST_WORKSPACE=1 plus bot tokens in the environment",
    "live_api: calls a real third-party API (ORCID/NCBI/grants.gov); needs LIVE_API_TESTS=1",
]

[tool.coverage.run]
branch = true
source = ["src"]
# Without this, every coverage number this project has ever reported is wrong —
# understated, and unevenly so. SQLAlchemy's asyncio layer runs ORM work inside
# greenlets, and coverage's tracer loses the frame across a greenlet switch. The
# symptom is precise: in an async route handler, the statement holding the FIRST
# `await db.execute(...)` is recorded and everything after it is reported missing,
# even in handlers the tests demonstrably drive to completion. Measured on
# src/routers/admin.py against the same suite and the same commit: 19% without
# this line, 41% with it (484 vs 359 statements missed). So the shortfall is
# largest in exactly the modules that talk to the database most.
#
# Re-measured 2026-08-04 with this line in place: the suite's true total is 61.638%,
# not the 35.66% the suppressed data reported. COV_MIN in scripts/ci.sh has been
# re-baselined from 35 to 60 accordingly.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = false
# Two decimals, not 0. At precision = 0 the total printed as "62%" while the real
# figure was 61.638% — i.e. the report rounded UP past the true value, so anyone
# re-baselining COV_MIN off the printed number would set a floor the suite cannot
# actually meet. A ratchet is only as good as the number you read it from.
precision = 2

# Mutation-testing scope lives in scripts/mutation.sh (CLI flags), not here — mutmut
# 2.x reads setup.cfg/CLI rather than pyproject's [tool.mutmut].
