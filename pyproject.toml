[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copi"
version = "0.1.0"
description = "CoPI/LabAgent — Research collaboration platform with Slack-based AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "anthropic>=0.26.0",
    "slack-sdk>=3.27.0",
    "pydantic-settings>=2.2.0",
    "itsdangerous>=2.2.0",
    "boto3>=1.34.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "plotly>=5.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "testcontainers[postgres]>=4.0.0",
    "respx>=0.21.0",
    "syrupy>=4.6.0",
    "coverage[toml]>=7.5.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "mutmut>=3.0.0",
]

[project.scripts]
copi = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: needs a real Postgres (testcontainers) + Docker",
    "characterization: golden-master snapshot test",
    "contract: respx-mocked external HTTP",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = false
precision = 0
