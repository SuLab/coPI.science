services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    # Decision D24: no mem_limit/cpus here. A cgroup mem cap on a ~2.3 GB
    # database also caps its page cache, and an OOM-killed backend restarts
    # the whole cluster -- worse than the failure mode caps elsewhere guard
    # against.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-copi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: awslogs
      options:
        awslogs-group: /copi/postgres
        tag: postgres
        awslogs-create-group: "true"
        awslogs-region: ${AWS_REGION:-us-east-2}

  migrate:
    build:
      context: .
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-copi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-copi}
      SECRET_KEY: ${SECRET_KEY:?Set a strong random SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Same knob run_migration.sh already reads (alembic/env.py:66) — a
      # routine `alembic upgrade head` here should never need to wait long,
      # but give it the same override surface as the gated runbook.
      ALEMBIC_LOCK_TIMEOUT_MS: ${ALEMBIC_LOCK_TIMEOUT_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-group: /copi/migrate
        tag: migrate
        awslogs-create-group: "true"
        awslogs-region: ${AWS_REGION:-us-east-2}

  app:
    build:
      context: .
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-copi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-copi}
      # Fail fast at `docker compose up` if no secret is provided, and default
      # the process to production so the insecure default SECRET_KEY is rejected.
      SECRET_KEY: ${SECRET_KEY:?Set a strong random SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ./profiles:/app/profiles
      - ./prompts:/app/prompts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen(\\\"http://127.0.0.1:8000/api/health\\\")\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: awslogs
      options:
        awslogs-group: /copi/app
        tag: app
        awslogs-create-group: "true"
        awslogs-region: ${AWS_REGION:-us-east-2}

  worker:
    build:
      context: .
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command: ["python", "-m", "src.worker.main"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-copi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-copi}
      # Fail fast at `docker compose up` if no secret is provided, and default
      # the process to production so the insecure default SECRET_KEY is rejected.
      SECRET_KEY: ${SECRET_KEY:?Set a strong random SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ./profiles:/app/profiles
      - ./prompts:/app/prompts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: awslogs
      options:
        awslogs-group: /copi/worker
        tag: worker
        awslogs-create-group: "true"
        awslogs-region: ${AWS_REGION:-us-east-2}

  agent:
    build:
      context: .
    mem_limit: 768m
    cpus: 1.0
    # An OOM kill is SIGKILL and skips the shutdown flush that persists the
    # in-flight turn; the runbook's `docker stop -t 30` relies on this.
    stop_grace_period: 30s
    command: ["python", "-m", "src.agent.main"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-copi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-copi}
      # Fail fast at `docker compose up` if no secret is provided, and default
      # the process to production so the insecure default SECRET_KEY is rejected.
      SECRET_KEY: ${SECRET_KEY:?Set a strong random SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ./profiles:/app/profiles
      - ./prompts:/app/prompts
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - agent
    logging:
      driver: awslogs
      options:
        awslogs-group: /copi/agent
        tag: agent
        awslogs-create-group: "true"
        awslogs-region: ${AWS_REGION:-us-east-2}

  grantbot:
    build:
      context: .
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    command: ["python", "-m", "src.agent.grantbot", "scheduler", "--run-hour", "8", "--max-per-channel", "1"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-copi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-copi}
      # Fail fast at `docker compose up` if no secret is provided, and default
      # the process to production so the insecure default SECRET_KEY is rejected.
      SECRET_KEY: ${SECRET_KEY:?Set a strong random SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ./profiles:/app/profiles
      - ./prompts:/app/prompts
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: awslogs
      options:
        awslogs-group: /copi/grantbot
        tag: grantbot
        awslogs-create-group: "true"
        awslogs-region: ${AWS_REGION:-us-east-2}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Memory budget, re-derived 2026-09-04 (#27 I5 / over-implementation R9).
    # The figure that used to sit here counted three limit_*_zone 10m plus
    # ssl_session_cache shared:SSL:10m, and predated 1a430c0, which split
    # those three zones into eight (one set per vhost) and left 90 MiB
    # declared into this 128m cgroup. This comment therefore
    # no longer restates nginx.conf's total; it states only the terms nginx
    # .conf cannot know, and tests/unit/test_nginx_config.py sums the zones
    # from nginx.conf itself and checks the whole budget against mem_limit:
    #   nginx-mem-budget: zones + 48 workers x 1.0 MiB + 16 MiB headroom
    # = 37 + 48 + 16 = 101 MiB today. 48 is the worker count the image's
    # stock `worker_processes auto` picks on the 48-core prod host (this is
    # not ours to pin -- the mounted file is a conf.d snippet and
    # worker_processes is a main-context directive). 1.0 MiB per worker is
    # the measured 36.48 MiB RSS for master + 48 workers idle (shmem
    # 640 KiB) rounded up for proxy/request buffers under load; the 16 MiB
    # flat headroom covers TLS handshake scratch and page-cache churn. 64m
    # OOMs under load. 1.0 cpus so a hard CFS quota doesn't throttle TLS
    # termination for all three vhosts even on an idle host.
    mem_limit: 128m
    cpus: 1.0
    ports:
      - "80:80"
      - "443:443"
    # Lets the devel.copi.science vhost reach a service bound to the host's
    # localhost:8858 (e.g. an SSH tunnel to a remote dev instance).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `default` keeps nginx on the project network (reaches app/postgres by
    # service name); `copi-edge` is the shared external network the second
    # (blackbird) stack's app joins so nginx can proxy to blackbird-app:8000.
    # See ../blackbird-copi-science/SECOND_INSTANCE_SETUP.md.
    networks:
      default: {}
      copi-edge: {}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --no-check-certificate -O /dev/null https://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: "/bin/sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && (while :; do sleep 6h & wait $${!}; nginx -s reload; done &) && nginx -g \"daemon off;\"'"
    logging:
      driver: awslogs
      options:
        awslogs-group: /copi/nginx
        tag: nginx
        awslogs-create-group: "true"
        awslogs-region: ${AWS_REGION:-us-east-2}

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    # certbot's import graph alone exceeds 32 MiB; PID 1 is a shell loop, so
    # the OOM killer takes the python child silently and renewals stop while
    # the container still reports "running".
    mem_limit: 128m
    cpus: 0.1
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    logging:
      driver: awslogs
      options:
        awslogs-group: /copi/certbot
        tag: certbot
        awslogs-create-group: "true"
        awslogs-region: ${AWS_REGION:-us-east-2}

volumes:
  pgdata:

# Shared edge network for cross-stack routing. Created once out-of-band
# (`docker network create copi-edge`) and referenced as external here so this
# compose file never tries to create/own it. Only nginx joins it on this side.
networks:
  copi-edge:
    external: true
